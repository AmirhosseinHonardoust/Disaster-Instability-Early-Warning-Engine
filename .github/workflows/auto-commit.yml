name: Auto Commit

on:
  schedule:
    - cron: '37 0,3,6,9,12,15,18,21 * * *'
    - cron: '7 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make a change
        run: echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> activity.log

      - name: Commit and push
        run: |
          git config user.name "AmirhosseinHonardoust"
          git config user.email "88084572+AmirhosseinHonardoust@users.noreply.github.com"
          git add activity.log
          git commit -m "chore: automated update $(date +%F-%H%M)" || echo "Nothing to commit"
          git push
